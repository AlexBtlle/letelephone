[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letelephone"
version = "0.3.0"
description = "Livre d'or audio sur Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "gpiozero",
]

[project.scripts]
letelephone = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
